name: "aidp_core"
version: "1.0.0"
config-version: 2

profile: "aidp_core"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  pii_handling_enabled: true
  control_fields_enabled: true
  scd_enabled: true

models:
  aidp_core:
    staging:
      +materialized: view
      +tags: ["staging"]
    silver:
      +materialized: table
      +tags: ["silver"]
